<!DOCTYPE html>
<html>
<head>
    <title>Blake Health & Strength Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding-bottom: 20px; }
        .tabs { display: flex; background: #1e1e1e; border-bottom: 2px solid #333; position: sticky; top: 0; z-index: 1000; }
        .tab { flex: 1; padding: 15px 2px; cursor: pointer; color: #888; font-weight: bold; font-size: 0.8rem; transition: 0.2s; }
        .tab.active { color: #00ff00; border-bottom: 3px solid #00ff00; background: rgba(0,255,0,0.05); }
        .page { display: none; padding: 15px; max-width: 600px; margin: 0 auto; }
        .page.active { display: block; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; }
        .timer { font-size: 5.5rem; font-weight: bold; color: #00ff00; font-family: monospace; line-height: 1; margin: 10px 0; }
        .jump-display { font-size: 6rem; color: #00eaff; font-weight: bold; text-shadow: 0 0 20px rgba(0,234,255,0.3); margin: 15px 0; }
        input, select { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 16px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin: 8px 0; font-size: 1rem; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.8; }
        .btn-blue { background: #007bff; color: white; }
        .btn-red { background: #ff4444; color: white; }
        .btn-green { background: #28a745; color: white; }
        .btn-cyan { background: #00eaff; color: #000; }
        .btn-dark { background: #333; color: white; border: 1px solid #555; }
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-toggle button { margin: 0; padding: 12px; font-size: 0.9rem; }
        .status-badge { display: inline-block; padding: 8px 15px; border-radius: 20px; background: #333; font-size: 0.9rem; margin-top: 10px; }
        .status-connected { background: rgba(0, 255, 0, 0.2); color: #00ff00; border: 1px solid #00ff00; }
        .last-run { font-size: 1.1rem; color: #00ff00; background: #000; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #333; font-weight: bold; }
        .split-log { color: #aaa; font-size: 1rem; margin: 10px 0; text-align: left; background: #0a0a0a; padding: 12px; border-radius: 8px; font-family: monospace; border: 1px solid #222; }
        .roster-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; text-align: left; }
        .btn-del { background: #ff4444; width: auto; padding: 6px 12px; font-size: 0.8rem; margin: 0; color: white; border-radius: 6px; }
        h2 { margin-top: 0; color: #00ff00; text-transform: uppercase; letter-spacing: 1px; font-size: 1.2rem; }
        .section-label { text-align: left; font-size: 0.85rem; color: #aaa; text-transform: uppercase; margin-top: 15px; display: block; }
    </style>
</head>
<body>

    <div class="tabs">
        <div id="tab-home" class="tab active" onclick="navTo('home')">HOME</div>
        <div id="tab-timer" class="tab" onclick="navTo('timer')">TIMER</div>
        <div id="tab-jump" class="tab" onclick="navTo('jump')">V-JUMP</div>
        <div id="tab-pb" class="tab" onclick="navTo('pb')">PB'S</div>
        <div id="tab-settings" class="tab" onclick="navTo('settings')">SETTINGS</div>
    </div>

    <div id="page-home" class="page active">
        <div class="card" style="padding: 40px 20px;">
            <h1 style="margin: 0 0 10px 0; font-size: 1.8rem;">Blake Health & Strength</h1>
            <p style="color: #888; margin-bottom: 30px;">Pro Performance Lab</p>
            <div id="connectControls">
                <button id="btnConnect" class="btn-blue" style="font-size: 1.2rem; padding: 20px;" onclick="connectBLE()">📡 CONNECT TO GATES</button>
                <button id="btnDisconnect" class="btn-red" style="display:none; font-size: 1.1rem;" onclick="disconnectBLE()">🔌 DISCONNECT GATES</button>
            </div>
            <div id="homeStatus" class="status-badge">Disconnected ❌</div>
        </div>
    </div>

    <div id="page-timer" class="page">
        <div class="card">
            <input type="text" id="eventName" placeholder="Event (e.g. 40yd Dash)" oninput="updatePBDisplay()">
            <select id="athleteSelect" class="athlete-sync" onchange="syncAthletes(this)"></select>
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">Event PB: <span id="currentPB" style="color:#00ff00; font-weight:bold;">--</span></div>
        </div>
        <div class="card">
            <div class="mode-toggle">
                <button id="btnStandard" class="btn-blue" onclick="setTimerMode('standard')">Standard</button>
                <button id="btnSplits" class="btn-dark" onclick="setTimerMode('splits')">Splits</button>
            </div>
            <div id="splitsSetup" style="display: none; text-align: left; margin-top: 10px;">
                <label style="font-size: 0.85rem; color: #aaa;">Target Breaks:</label>
                <input type="number" id="targetSplits" value="3" min="1">
            </div>
            <div class="timer" id="display">0.000</div>
            <div id="liveSplits" class="split-log" style="display: none;">Ready...</div>
            <div id="lastRunBox" class="last-run" style="display:none;"></div>
            <button class="btn-red" onclick="resetTimer()">RESET TIMER</button>
        </div>
    </div>

    <div id="page-jump" class="page">
        <div class="card">
            <select id="jumpAthleteSelect" class="athlete-sync" onchange="syncAthletes(this)"></select>
            <div style="font-size: 0.9rem; color: #aaa; margin-top: 5px;">Vertical PB: <span id="jumpPB" style="color:#00eaff; font-weight:bold;">--</span></div>
        </div>
        <div class="card">
            <h2 style="color:#00eaff; margin:0;">VERTICAL JUMP</h2>
            <div class="jump-display" id="jumpResult">0.0<span style="font-size:1.5rem;">in</span></div>
            <button id="btnArmJump" class="btn-cyan" onclick="armJump()">🚀 ARM JUMP MODE</button>
            <div id="jumpStatus" style="margin-top:10px; color:#aaa; font-weight:bold;">Status: Standby</div>
        </div>
    </div>

    <div id="page-pb" class="page">
        <div class="card" style="text-align: left;">
            <h2>Personal Bests</h2>
            <div id="pbList"></div>
        </div>
    </div>

    <div id="page-settings" class="page">
        <div class="card" style="text-align: left;">
            <h2>Roster Management</h2>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="newName" placeholder="Athlete Name" style="margin:0;">
                <button class="btn-green" style="width: auto; margin:0; padding: 0 20px;" onclick="addAthlete()">ADD</button>
            </div>
            <div id="rosterList" style="margin-top:15px; border-top:1px solid #333; max-height: 200px; overflow-y: auto;"></div>
        </div>
        <div class="card" style="text-align: left;">
            <h2>Google Sheets Sync</h2>
            <input type="text" id="sheetsUrlInput" placeholder="https://script.google.com/macros/s/..." onchange="saveSheetsUrl()">
        </div>
        <div class="card">
            <button class="btn-red" onclick="factoryReset()">Factory Reset App</button>
            <div style="color:#555; font-size:0.7rem; margin-top: 15px;">Version 3.6 (Athlete Sync + Jump PB)</div>
        </div>
    </div>

    <script>
        let startTime, lapStartTime, timerInterval, bleDevice, bleChar;
        let isConnected = false;
        let timerMode = 'standard'; 
        let splitTimes = [];
        
        let roster = JSON.parse(localStorage.getItem('roster')) || [];
        let pbs = JSON.parse(localStorage.getItem('pbs')) || {}; 
        let sheetsUrl = localStorage.getItem('sheetsUrl') || "";

        window.onload = () => {
            document.getElementById('sheetsUrlInput').value = sheetsUrl;
            renderRoster();
            setTimerMode('standard'); 
        };

        function navTo(target) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('page-' + target).classList.add('active');
            document.getElementById('tab-' + target).classList.add('active');
            
            if(target === 'pb') renderPBs();
            if(target === 'settings') renderRoster();
            if(target === 'timer') sendCommand("SET_SPRINT");
            if(target === 'jump') sendCommand("ARM_JUMP");
        }

        async function connectBLE() {
            try {
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Blake_SpeedGate' }],
                    optionalServices: ['4fafc201-1fb5-459e-8fcc-c5c9c331914b']
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
                bleChar = await service.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
                
                await bleChar.startNotifications();
                bleChar.addEventListener('characteristicvaluechanged', (e) => {
                    const val = new TextDecoder().decode(e.target.value);
                    if(val !== "IDLE") handleTrigger(val);
                });
                
                isConnected = true;
                updateUIForConnection(true);
                bleDevice.addEventListener('gattserverdisconnected', () => { isConnected = false; updateUIForConnection(false); });
                setTimeout(() => navTo('timer'), 800);
            } catch (err) { alert("Connect failed."); }
        }

        async function sendCommand(cmd) {
            if (bleChar && isConnected) {
                try {
                    const encoder = new TextEncoder();
                    await bleChar.writeValue(encoder.encode(cmd));
                } catch(e) { console.log("Command failed", e); }
            }
        }

        function syncAthletes(el) {
            const val = el.value;
            document.querySelectorAll('.athlete-sync').forEach(s => s.value = val);
            updatePBDisplay();
        }

        function handleTrigger(gate) {
            if (gate.startsWith("JUMP:")) {
                const height = gate.split(":")[1];
                handleJumpResult(height);
                return;
            }

            if (!startTime && gate === "GATE1") {
                startTime = performance.now();
                lapStartTime = startTime;
                splitTimes = [];
                document.getElementById('lastRunBox').style.display = "none";
                if(timerMode === 'splits') document.getElementById('liveSplits').innerHTML = "🏃 RUNNING...";
                timerInterval = setInterval(() => {
                    document.getElementById('display').innerHTML = ((performance.now() - lapStartTime) / 1000).toFixed(3);
                }, 10);
            } else if (startTime) {
                let now = performance.now();
                let lapTime = ((now - lapStartTime) / 1000).toFixed(3);
                let totalTime = ((now - startTime) / 1000).toFixed(3);

                if (timerMode === 'standard' && gate === "GATE2") stopTimer(totalTime);
                else if (timerMode === 'splits' && gate === "GATE1") {
                    if (parseFloat(lapTime) < 0.5) return; 
                    splitTimes.push(lapTime);
                    lapStartTime = now;
                    document.getElementById('liveSplits').innerHTML = splitTimes.map((s, i) => `Lap ${i+1}: ${s}s`).join('<br>');
                    if (splitTimes.length >= parseInt(document.getElementById('targetSplits').value)) stopTimer(totalTime);
                }
            }
        }

        function handleJumpResult(height) {
            document.getElementById('jumpResult').innerHTML = height + `<span style="font-size:1.5rem;">in</span>`;
            document.getElementById('jumpStatus').innerHTML = "Landed! Resetting...";
            document.getElementById('jumpStatus').style.color = "#aaa";

            const athlete = document.getElementById('jumpAthleteSelect').value || "Guest";
            const event = "Vertical Jump";
            
            let isPB = false;
            if (athlete !== "Guest") {
                if (!pbs[athlete]) pbs[athlete] = {};
                if (!pbs[athlete][event] || parseFloat(height) > parseFloat(pbs[athlete][event])) {
                    pbs[athlete][event] = height;
                    localStorage.setItem('pbs', JSON.stringify(pbs));
                    isPB = true;
                }
            }
            updatePBDisplay();

            if(sheetsUrl && sheetsUrl.length > 10) {
                fetch(`${sheetsUrl}?athlete=${encodeURIComponent(athlete)}&event=${encodeURIComponent(event)}&time=${height}&splits=N/A`)
                .catch(e => console.log("Sync failed"));
            }
        }

        function stopTimer(finalTotalTimeStr) {
            clearInterval(timerInterval);
            const athlete = document.getElementById('athleteSelect').value || "Guest";
            const event = document.getElementById('eventName').value || "General";
            const finalTotalTime = parseFloat(finalTotalTimeStr).toFixed(3);

            let isPB = false;
            if (athlete !== "Guest") {
                if (!pbs[athlete]) pbs[athlete] = {};
                if (!pbs[athlete][event] || parseFloat(finalTotalTime) < parseFloat(pbs[athlete][event])) {
                    pbs[athlete][event] = finalTotalTime;
                    localStorage.setItem('pbs', JSON.stringify(pbs));
                    isPB = true;
                }
            }

            const lastBox = document.getElementById('lastRunBox');
            lastBox.innerHTML = `<strong>${athlete}: ${finalTotalTime}s</strong> ${isPB ? '🔥 PB!' : ''}`;
            if (timerMode === 'splits') lastBox.innerHTML += `<br><span style="font-size:0.9rem; color:#aaa;">Laps: ${splitTimes.join(' / ')}</span>`;
            lastBox.style.display = "block";
            startTime = null;
            updatePBDisplay();

            if(sheetsUrl && sheetsUrl.length > 10) {
                const splitsData = timerMode === 'splits' ? splitTimes.join('|') : "";
                fetch(`${sheetsUrl}?athlete=${encodeURIComponent(athlete)}&event=${encodeURIComponent(event)}&time=${finalTotalTime}&splits=${splitsData}`);
            }
        }

        function updatePBDisplay() {
            const athlete = document.getElementById('athleteSelect').value;
            const event = document.getElementById('eventName').value || "General";
            const jumpEvent = "Vertical Jump";
            
            const sprintPB = (athlete !== "Guest" && pbs[athlete] && pbs[athlete][event]) ? pbs[athlete][event] : "--";
            const jumpPBVal = (athlete !== "Guest" && pbs[athlete] && pbs[athlete][jumpEvent]) ? pbs[athlete][jumpEvent] : "--";
            
            document.getElementById('currentPB').innerText = sprintPB + (sprintPB !== "--" ? "s" : "");
            document.getElementById('jumpPB').innerText = jumpPBVal + (jumpPBVal !== "--" ? "in" : "");
        }

        function resetTimer() { startTime = null; lapStartTime = null; splitTimes = []; clearInterval(timerInterval); document.getElementById('display').innerHTML = "0.000"; document.getElementById('lastRunBox').style.display = "none"; }
        function armJump() { document.getElementById('jumpStatus').innerHTML = "READY: JUMP WHEN READY"; document.getElementById('jumpStatus').style.color = "#00ff00"; sendCommand("ARM_JUMP"); }
        function addAthlete() { const n = document.getElementById('newName'); if(n.value && !roster.includes(n.value)){ roster.push(n.value); localStorage.setItem('roster', JSON.stringify(roster)); n.value=""; renderRoster(); } }
        function deleteAthlete(i) { if(confirm("Delete?")){ roster.splice(i, 1); localStorage.setItem('roster', JSON.stringify(roster)); renderRoster(); } }
        function renderRoster() { 
            const list = document.getElementById('rosterList');
            list.innerHTML = roster.length ? roster.map((name, i) => `<div class="roster-item"><span>${name}</span><button class="btn-del" onclick="deleteAthlete(${i})">X</button></div>`).join('') : "<div style='color:#666;'>No athletes.</div>";
            const selects = document.querySelectorAll('.athlete-sync');
            selects.forEach(s => { const cur = s.value; s.innerHTML = `<option value="Guest">Guest</option>` + roster.map(n => `<option value="${n}">${n}</option>`).join(''); s.value = cur || "Guest"; });
            updatePBDisplay();
        }
        function renderPBs() { 
            const list = document.getElementById('pbList');
            if(!Object.keys(pbs).length){ list.innerHTML = "No PBs."; return; }
            let html = "";
            for(let a in pbs){ html += `<div style="margin-bottom:15px;"><strong style="color:#00ff00;">${a}</strong>`; for(let e in pbs[a]){ html += `<div style="display:flex; justify-content:space-between; font-size:0.9rem;"><span style="color:#aaa;">${e}:</span><span>${pbs[a][e]}${e==="Vertical Jump"?"in":"s"}</span></div>`; } html += `</div>`; }
            list.innerHTML = html;
        }
        function updateUIForConnection(c) { document.getElementById('homeStatus').innerHTML = c ? "Connected ✅" : "Disconnected ❌"; document.getElementById('btnConnect').style.display = c ? 'none' : 'block'; document.getElementById('btnDisconnect').style.display = c ? 'block' : 'none'; }
        function saveSheetsUrl() { localStorage.setItem('sheetsUrl', document.getElementById('sheetsUrlInput').value.trim()); }
        function factoryReset() { if(confirm("Wipe all?")){ localStorage.clear(); location.reload(); } }
        function disconnectBLE() { if(bleDevice) bleDevice.gatt.disconnect(); }
    </script>
</body>
</html>
